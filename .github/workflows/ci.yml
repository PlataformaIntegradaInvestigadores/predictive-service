name: CI — predictive_model_backend

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  branch-name:
    if: github.event_name == 'pull_request'
    uses: PlataformaIntegradaInvestigadores/.github/.github/workflows/branch-name.yml@main

  # ── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: Pruebas unitarias e integración
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias del sistema
        run: sudo apt-get install -y libgomp1
      - name: Instalar dependencias
        run: pip install -q -r requirements.txt pytest httpx pytest-cov
      - name: Ejecutar tests unitarios
        run: |
          pytest tests/ -v --tb=short \
            --ignore=tests/test_integration.py \
            --junitxml=report-unit.xml \
            --cov=app --cov-report=term --cov-report=xml:coverage-unit.xml --cov-fail-under=90
      - name: Ejecutar tests de integración
        run: |
          pytest tests/ -v --tb=short -m integration \
            --junitxml=report-integration.xml \
            --cov=app --cov-report=term --cov-report=xml:coverage-integration.xml
      - name: Subir resultados
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: |
            report-unit.xml
            coverage-unit.xml
            report-integration.xml
            coverage-integration.xml

  # ── Docker build ───────────────────────────────────────────────────────────
  build-docker:
    name: Build imagen Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Build imagen
        run: docker build -t predictive_model_backend:${{ github.sha }} .
      - name: Verificar imagen
        run: docker images predictive_model_backend

  # ── Deploy staging ─────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy a servidor staging
    runs-on: [self-hosted, staging]
    needs: test
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Actualizar codigo
        run: |
          cd /opt/centinela/predictive-service
          git fetch origin develop
          git reset --hard origin/develop

      - name: Reconstruir contenedor
        run: |
          cd /opt/centinela
          docker compose up -d --build --no-deps predictive-service

      - name: Health check
        run: |
          sleep 15
          HEALTHY=false
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8003/health || echo "000")
            echo "Intento $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              HEALTHY=true; break
            fi
            sleep 6
          done
          if [ "$HEALTHY" = "false" ]; then
            echo "Health check fallido — rollback"
            cd /opt/centinela/predictive-service && git reset --hard HEAD~1
            cd /opt/centinela && docker compose up -d --build --no-deps predictive-service
            exit 1
          fi
