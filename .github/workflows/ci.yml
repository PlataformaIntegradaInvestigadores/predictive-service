name: CI — predictive_model_backend

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  branch-name:
    name: Validate branch name
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check prefix + target (org-wide convention)
        env:
          BRANCH: ${{ github.head_ref }}
          TARGET: ${{ github.base_ref }}
        run: |
          case "$TARGET" in
            develop)
              case "$BRANCH" in
                feature/*|chore/*) echo "OK: $BRANCH -> $TARGET"; exit 0 ;;
                *) echo "Branch '$BRANCH' is invalid for target develop (use feature/* or chore/*)"; exit 1 ;;
              esac
              ;;
            main)
              case "$BRANCH" in
                develop|hotfix/*) echo "OK: $BRANCH -> $TARGET"; exit 0 ;;
                *) echo "Branch '$BRANCH' is invalid for target main (use develop or hotfix/*)"; exit 1 ;;
              esac
              ;;
            *)
              echo "Unknown target: $TARGET"; exit 1 ;;
          esac

  test-unit:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: sudo apt-get install -y libgomp1
      - name: Install Python dependencies
        run: pip install -q -r requirements.txt pytest httpx pytest-cov
      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short \
            --ignore=tests/test_integration.py \
            --junitxml=report-unit.xml \
            --cov=app --cov-report=term --cov-report=xml:coverage-unit.xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: |
            report-unit.xml
            coverage-unit.xml

  test-integration:
    name: Integration tests (pytest)
    runs-on: ubuntu-latest
    needs: test-unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: sudo apt-get install -y libgomp1
      - name: Install Python dependencies
        run: pip install -q -r requirements.txt pytest httpx pytest-cov
      - name: Run integration tests
        run: |
          pytest tests/ -v --tb=short -m integration \
            --junitxml=report-integration.xml \
            --cov=app --cov-report=term --cov-report=xml:coverage-integration.xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: |
            report-integration.xml
            coverage-integration.xml

  build-docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t predictive_model_backend:${{ github.sha }} .
      - name: Verify image
        run: docker images predictive_model_backend

  deploy-staging:
    name: Deploy to staging server
    runs-on: [self-hosted, staging]
    needs: [test-unit, test-integration]
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Update code
        run: |
          cd /opt/centinela/predictive_model_backend
          git fetch origin develop
          git reset --hard origin/develop

      - name: Rebuild container
        run: |
          cd /opt/centinela
          docker compose up -d --build --no-deps predictive-backend

      - name: Health check
        run: |
          sleep 15
          HEALTHY=false
          for i in 1 2 3 4 5; do
            RESPONSE=$(curl -s --max-time 5 http://localhost:8003/api/v1/recommendations/health || echo '{}')
            echo "Attempt $i: $RESPONSE"
            if echo "$RESPONSE" | grep -q '"service_initialized":[[:space:]]*true'; then
              HEALTHY=true; break
            fi
            sleep 6
          done
          if [ "$HEALTHY" = "false" ]; then
            echo "Health check failed — rolling back"
            cd /opt/centinela/predictive_model_backend && git reset --hard HEAD~1
            cd /opt/centinela && docker compose up -d --build --no-deps predictive-backend
            exit 1
          fi
