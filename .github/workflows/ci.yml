name: CI — predictive_model_backend

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  branch-name:
    name: Validar nombre de rama
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Verificar prefijo (feature/*, hotfix/*, chore/*)
        run: |
          BRANCH="${{ github.head_ref }}"
          case "$BRANCH" in
            feature/*|hotfix/*|chore/*) echo "OK: $BRANCH"; exit 0 ;;
            *) echo "Rama '$BRANCH' no cumple convención (feature/*, hotfix/*, chore/*)"; exit 1 ;;
          esac

  # ── Unitarios ──────────────────────────────────────────────────────────────
  test-unit:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Instalar dependencias del sistema
        run: sudo apt-get install -y libgomp1
      - name: Instalar dependencias Python
        run: pip install -q -r requirements.txt pytest httpx pytest-cov
      - name: Ejecutar tests unitarios
        run: |
          pytest tests/ -v --tb=short \
            --ignore=tests/test_integration.py \
            --junitxml=report-unit.xml \
            --cov=app --cov-report=term --cov-report=xml:coverage-unit.xml
      - name: Subir resultados
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            report-unit.xml
            coverage-unit.xml

  # ── Integración ────────────────────────────────────────────────────────────
  test-integration:
    name: Pruebas de integración
    runs-on: ubuntu-latest
    needs: test-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Instalar dependencias del sistema
        run: sudo apt-get install -y libgomp1
      - name: Instalar dependencias Python
        run: pip install -q -r requirements.txt pytest httpx pytest-cov
      - name: Ejecutar tests de integración
        run: |
          pytest tests/ -v --tb=short -m integration \
            --junitxml=report-integration.xml \
            --cov=app --cov-report=term --cov-report=xml:coverage-integration.xml
      - name: Subir resultados
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: |
            report-integration.xml
            coverage-integration.xml

  # ── Docker build ───────────────────────────────────────────────────────────
  build-docker:
    name: Build imagen Docker
    runs-on: ubuntu-latest
    needs: test-integration
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build imagen
        run: docker build -t predictive_model_backend:${{ github.sha }} .
      - name: Verificar imagen
        run: docker images predictive_model_backend

  # ── Deploy staging ─────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy a servidor staging
    runs-on: [self-hosted, staging]
    needs: test-integration
    if: github.ref == 'refs/heads/staging'
    steps:
      - name: Actualizar codigo
        run: |
          cd /opt/centinela/predictive_model_backend
          git fetch origin staging
          git reset --hard origin/staging

      - name: Reconstruir contenedor
        run: |
          cd /opt/centinela
          docker compose up -d --build --no-deps predictive-backend

      - name: Health check
        run: |
          sleep 15
          HEALTHY=false
          for i in 1 2 3 4 5; do
            RESPONSE=$(curl -s --max-time 5 http://localhost:8003/api/v1/recommendations/health || echo '{}')
            echo "Intento $i: $RESPONSE"
            if echo "$RESPONSE" | grep -q '"service_initialized":[[:space:]]*true'; then
              HEALTHY=true; break
            fi
            sleep 6
          done
          if [ "$HEALTHY" = "false" ]; then
            echo "Health check fallido — el servicio respondio pero no se inicializo (revisar CENTINELA_DATA_PATH y la carpeta ./data en el servidor) — rollback"
            cd /opt/centinela/predictive_model_backend && git reset --hard HEAD~1
            cd /opt/centinela && docker compose up -d --build --no-deps predictive-backend
            exit 1
          fi
