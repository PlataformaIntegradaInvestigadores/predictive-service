name: 'CD — predictive_model_backend → Production'

on:
  push:
    branches: [main]

jobs:
  test-unit:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: sudo apt-get install -y libgomp1
      - name: Install Python dependencies
        run: pip install -q -r requirements.txt pytest httpx pytest-cov
      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short \
            --ignore=tests/test_integration.py \
            --junitxml=report-unit-prod.xml \
            --cov=app --cov-report=term --cov-report=xml:coverage-unit-prod.xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-prod
          path: |
            report-unit-prod.xml
            coverage-unit-prod.xml

  test-integration:
    name: Integration tests (pytest)
    runs-on: ubuntu-latest
    needs: test-unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: sudo apt-get install -y libgomp1
      - name: Install Python dependencies
        run: pip install -q -r requirements.txt pytest httpx pytest-cov
      - name: Run integration tests
        run: |
          pytest tests/ -v --tb=short -m integration \
            --junitxml=report-integration-prod.xml \
            --cov=app --cov-report=term --cov-report=xml:coverage-integration-prod.xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-prod
          path: |
            report-integration-prod.xml
            coverage-integration-prod.xml

  deploy-production:
    name: Deploy to production server
    runs-on: [self-hosted, production]
    needs: [test-unit, test-integration]
    steps:
      - name: Update code
        run: |
          cd /opt/centinela/predictive_model_backend
          git fetch origin main
          git reset --hard origin/main

      - name: Rebuild container
        run: |
          cd /opt/centinela
          docker compose up -d --build --no-deps predictive-backend

      - name: Health check with automatic rollback
        run: |
          sleep 15
          HEALTHY=false
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8003/health || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "404" ]; then
              HEALTHY=true; break
            fi
            sleep 6
          done
          if [ "$HEALTHY" = "false" ]; then
            echo "Health check failed — rolling back to previous commit"
            cd /opt/centinela/predictive_model_backend && git reset --hard HEAD~1
            cd /opt/centinela && docker compose up -d --build --no-deps predictive-backend
            exit 1
          fi
          echo "Deploy succeeded — predictive_model_backend is live in production"
